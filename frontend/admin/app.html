<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oneira — Admin Panel</title>
<link rel="stylesheet" href="../shared/tokens.css?v=13">
<link rel="stylesheet" href="../main/app.css?v=504">
<link rel="stylesheet" href="app.css?v=20">
<link rel="stylesheet" href="overview.css?v=9">
<link rel="stylesheet" href="users.css?v=18">
<link rel="stylesheet" href="servers.css?v=2">
</head>
<body>

<div id="admin-shell" hidden>
  <div id="admin-top">
    <div class="admin-brand"><span class="admin-brand-mark"></span>ADMIN PANEL</div>
    <div class="admin-pages" id="admin-pages"></div>
    <button type="button" class="admin-back" id="admin-back">Back</button>
  </div>
  <div id="admin-body">
    <div id="admin-left">
      <div id="admin-left-head"></div>
      <div id="admin-sections"></div>
      <div id="admin-left-foot"></div>
    </div>
    <div id="admin-main"></div>
  </div>
</div>

<div id="admin-layout-overlay" hidden>
  <button type="button" id="admin-layout-close">Close</button>
  <div class="admin-layout-grid">
    <div id="secondary-panel">
      <div id="server-sidebar-view">
        <div id="server-sidebar-face">
          <div id="server-sidebar-banner"></div>
          <div id="server-sidebar-header">
            <span id="server-sidebar-name"></span>
          </div>
        </div>
        <div id="server-sidebar-body">
          <div class="server-sidebar-group-label" id="server-channels-label">Channels</div>
          <div id="category-list"></div>
        </div>
      </div>
    </div>
    <div id="main-panel">
      <div class="main-view active" id="view-channel">
        <div class="view-header">
          <div class="header-title-group">
            <div class="header-title-stack">
              <span id="channel-header-title">No channel selected</span>
              <span id="channel-header-desc" class="header-description" hidden></span>
            </div>
          </div>
          <div class="header-actions" id="channel-header-actions">
            <button type="button" class="icon-btn" id="admin-layout-call" disabled title="Call">Call</button>
            <button type="button" class="icon-btn chat-pins-btn" id="channel-pins-btn" disabled title="Pinned messages">Pins</button>
            <div class="chat-search-slot">
              <div class="chat-search-shell">
                <input type="search" class="chat-search-input" placeholder="Search" autocomplete="off" spellcheck="false" disabled>
              </div>
            </div>
            <button type="button" class="icon-btn" id="admin-layout-overflow" disabled title="Chat settings">&#8942;</button>
          </div>
        </div>
        <div id="channel-body">
          <div id="channel-empty" class="centered-empty-state">
            <div class="badge" id="channel-empty-badge">#</div>
            <p class="welcome-title" id="channel-welcome-title"></p>
            <p class="welcome-sub" id="channel-welcome-sub"></p>
          </div>
          <div id="channel-messages" class="self-right" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="admin-report-overlay" hidden>
  <div id="admin-report-modal" role="dialog" aria-modal="true" aria-labelledby="admin-report-title">
    <div class="admin-report-left" id="admin-report-left"></div>
    <div class="admin-report-right">
      <div class="admin-report-head">
        <span id="admin-report-title">Create Report</span>
      </div>
      <div class="admin-report-body" id="admin-report-body"></div>
      <div class="admin-report-foot">
        <p class="admin-report-error" id="admin-report-error" hidden></p>
        <button type="button" class="admin-report-cancel" id="admin-report-cancel">Cancel</button>
        <button type="button" class="admin-report-create" id="admin-report-create">Create</button>
      </div>
    </div>
  </div>
</div>

<div id="admin-mod-overlay" hidden>
  <div id="admin-mod-modal" role="dialog" aria-modal="true" aria-labelledby="admin-mod-title">
    <div class="admin-mod-header">
      <span id="admin-mod-title">Moderate</span>
      <button type="button" class="admin-mod-x" id="admin-mod-close" title="Close">×</button>
    </div>
    <div class="admin-mod-body" id="admin-mod-body"></div>
    <div class="admin-mod-footer">
      <p class="admin-mod-error" id="admin-mod-error" hidden></p>
      <button type="button" class="admin-mod-cancel" id="admin-mod-cancel">Cancel</button>
      <button type="button" class="admin-mod-confirm" id="admin-mod-confirm">Confirm</button>
    </div>
  </div>
</div>

<script src="../shared/config.js?v=5"></script>
<script src="../main/util.js?v=53"></script>
<script src="../shared/media-player.js?v=6"></script>
<script src="../shared/music-player.js?v=2"></script>
<script src="../shared/embed-frame.js?v=1"></script>
<script src="../shared/gallery-frame.js?v=1"></script>
<script src="profile-bridge.js?v=1"></script>
<script src="../main/profile-identity.js?v=19"></script>
<script src="../main/profile-comments.js?v=9"></script>
<script src="../main/profile-board.js?v=137"></script>
<script src="../main/mini-profile.js?v=45"></script>
<script src="app-shell.js?v=10"></script>
<script src="chrome.js?v=8"></script>
<script src="overview.js?v=15"></script>
<script src="users.js?v=18"></script>
<script src="servers.js?v=7"></script>
<script src="reports.js?v=2"></script>
<script src="community.js?v=2"></script>
<script src="news.js?v=2"></script>
<script src="settings.js?v=2"></script>
<script src="boot.js?v=3"></script>
</body>
</html>
