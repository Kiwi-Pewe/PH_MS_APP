<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oneira — Log In</title>
<link rel="stylesheet" href="shared/tokens.css?v=6">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="card" id="login-card">
  <h1>Log In</h1>
  <label for="login-username">Username</label>
  <input type="text" id="login-username" placeholder="Username">
  <label for="login-password">Password</label>
  <input type="password" id="login-password" placeholder="Password">
  <button onclick="login()">Log In</button>
  <div id="status"></div>
  <div class="switch">No account? <a href="#" onclick="showRegister(); return false;">Register</a></div>
</div>

<div class="card" id="register-card" style="display:none;">
  <h1>Register</h1>
  <label for="register-username">Username</label>
  <input type="text" id="register-username" placeholder="Username">
  <label for="register-password">Password</label>
  <input type="password" id="register-password" placeholder="Password">
  <button onclick="register()">Register</button>
  <div id="register-status"></div>
  <div class="switch">Already have an account? <a href="#" onclick="showLogin(); return false;">Log In</a></div>
</div>

<script src="shared/config.js"></script>
<script src="login.js"></script>
</body>
</html>
