<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PH_MS_APP — Test Client</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #1b1d23;
    color: #e8e8ec;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #24262e;
    border: 1px solid #33353f;
    border-radius: 10px;
    padding: 28px;
    width: 380px;
  }
  h1 {
    font-size: 16px;
    letter-spacing: 0.02em;
    color: #9a9cab;
    text-transform: uppercase;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #9a9cab;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    background: #1b1d23;
    border: 1px solid #3a3d49;
    border-radius: 6px;
    color: #e8e8ec;
    font-size: 14px;
    margin-bottom: 14px;
  }
  input:focus { outline: none; border-color: #6c7bff; }
  button {
    width: 100%;
    padding: 11px;
    background: #6c7bff;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #5867e8; }
  #status {
    font-size: 12px;
    color: #6c7bff;
    margin-top: 10px;
    min-height: 16px;
  }
</style>
</head>
<body>

<div class="card" id="login-card">
  <h1>Login</h1>
  <label for="server-address">Server Address</label>
  <input type="text" id="server-address" placeholder="e.g. 192.168.1.182:8000" value="127.0.0.1:8000">
  <label for="login-username">Username</label>
  <input type="text" id="login-username" placeholder="e.g. kiwi">
  <label for="login-password">Password</label>
  <input type="password" id="login-password" placeholder="Password">
  <button onclick="login()">Log In</button>
  <div id="status"></div>
  <div style="margin-top:14px; font-size:13px; color:#9a9cab;">
    No account? <a href="#" onclick="showRegister(); return false;" style="color:#6c7bff;">Register</a>
  </div>
</div>

<div class="card" id="register-card" style="display:none;">
  <h1>Register</h1>
  <label for="server-address-register">Server Address</label>
  <input type="text" id="server-address-register" placeholder="e.g. 192.168.1.182:8000" value="127.0.0.1:8000">
  <label for="register-username">Username</label>
  <input type="text" id="register-username" placeholder="e.g. kiwi">
  <label for="register-password">Password</label>
  <input type="password" id="register-password" placeholder="Password">
  <button onclick="register()">Register</button>
  <div id="register-status"></div>
  <div style="margin-top:14px; font-size:13px; color:#9a9cab;">
    Already have an account? <a href="#" onclick="showLogin(); return false;" style="color:#6c7bff;">Log In</a>
  </div>
</div>

<div class="card" id="chat-card" style="display:none; width:420px;">
  <h1>Connected as <span id="my-id"></span></h1>
  <label for="receiver-id">Send to (Account ID)</label>
  <input type="number" id="receiver-id" placeholder="e.g. 2">
  <label for="content">Message</label>
  <input type="text" id="content" placeholder="Type a message">
  <button onclick="sendMessage()">Send</button>
  <div id="log" style="margin-top:16px; max-height:240px; overflow-y:auto; font-size:13px; line-height:1.6;"></div>
  <button onclick="logout()" style="margin-top:16px; background:#3a3d49;">Log Out</button>
</div>

<script>
let ws = null;
let myId = null;
let serverAddress = null;

window.addEventListener("load", () => {
  serverAddress = window.location.host;
  connectSocket(true);
});

function showRegister() {
  document.getElementById("login-card").style.display = "none";
  document.getElementById("register-card").style.display = "block";
}

function showLogin() {
  document.getElementById("register-card").style.display = "none";
  document.getElementById("login-card").style.display = "block";
}

async function register() {
  const address = document.getElementById("server-address-register").value;
  const username = document.getElementById("register-username").value;
  const password = document.getElementById("register-password").value;
  const status = document.getElementById("register-status");

  if (!address || !username || !password) {
    status.textContent = "Fill in all fields.";
    return;
  }

  status.textContent = "Registering...";

  try {
    const response = await fetch(`http://${address}/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    if (!response.ok) {
      const err = await response.json();
      status.textContent = err.detail || "Registration failed.";
      return;
    }

    status.textContent = "Account created. You can log in now.";
  } catch (e) {
    status.textContent = "Could not reach server.";
  }
}

async function login() {
  const address = document.getElementById("server-address").value;
  const username = document.getElementById("login-username").value;
  const password = document.getElementById("login-password").value;
  const status = document.getElementById("status");

  if (!address || !username || !password) {
    status.textContent = "Fill in all fields.";
    return;
  }

  status.textContent = "Logging in...";

  try {
    const response = await fetch(`http://${address}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ username, password })
    });

    if (!response.ok) {
      const err = await response.json();
      status.textContent = err.detail || "Login failed.";
      return;
    }

    const user = await response.json();
    myId = user.id;
    serverAddress = address;
    status.textContent = "";
    connectSocket();
  } catch (e) {
    status.textContent = "Could not reach server.";
  }
}

function connectSocket(isAutoAttempt = false) {
  const status = document.getElementById("status");
  if (!isAutoAttempt) status.textContent = "Connecting...";

  ws = new WebSocket(`ws://${serverAddress}/ws`);

  ws.onopen = () => {
    status.textContent = "";
    document.getElementById("login-card").style.display = "none";
    document.getElementById("register-card").style.display = "none";
    document.getElementById("chat-card").style.display = "block";
    document.getElementById("my-id").textContent = myId || "(existing session)";
  };

  ws.onclose = () => {
    ws = null;
    document.getElementById("chat-card").style.display = "none";
    document.getElementById("login-card").style.display = "block";
    // On an auto-login attempt, a close just means there's no valid session yet — not a real error.
    status.textContent = isAutoAttempt ? "" : "Disconnected.";
  };

  ws.onerror = () => {
    if (!isAutoAttempt) {
      status.textContent = "Connection failed. Are you logged in and is the server running?";
    }
  };

  ws.onmessage = (event) => {
    logLine(event.data, "incoming");
  };
}

async function logout() {
  try {
    await fetch(`http://${serverAddress}/logout`, {
      method: "POST",
      credentials: "include"
    });
  } catch (e) {
    // Even if this fails (e.g. server unreachable), still tear down the local connection below.
  }

  if (ws) {
    ws.close();
    ws = null;
  }
  document.getElementById("log").innerHTML = "";
  document.getElementById("status").textContent = "Logged out.";
  myId = null;
}

function sendMessage() {
  const receiverId = document.getElementById("receiver-id").value;
  const contentInput = document.getElementById("content");
  const content = contentInput.value;

  if (!receiverId || !content) return;

  ws.send(JSON.stringify({
    type: "message",
    receiver_id: parseInt(receiverId),
    content: content
  }));

  logLine(`You -> ${receiverId}: ${content}`, "outgoing");
  contentInput.value = "";
}

function logLine(text, kind) {
  const log = document.getElementById("log");
  const line = document.createElement("div");
  line.textContent = text;
  line.style.color = kind === "outgoing" ? "#9a9cab" : "#e8e8ec";
  line.style.marginBottom = "6px";
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}
</script>

</body>
</html>
